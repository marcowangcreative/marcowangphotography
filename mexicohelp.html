<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>USD ↔ MXN · Translate · Convert</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
      display: flex; flex-direction: column; align-items: center;
      font-family: 'DM Sans', 'Helvetica Neue', sans-serif;
      padding: 32px 16px; gap: 24px;
    }
    .card {
      width: 100%; max-width: 420px;
      background: rgba(255,255,255,0.04); backdrop-filter: blur(40px);
      border-radius: 24px; border: 1px solid rgba(255,255,255,0.08);
      padding: 32px 24px; box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .header h2 { color: #fff; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .header .sub { color: rgba(255,255,255,0.35); font-size: 12px; font-family: 'Space Mono', monospace; margin-top: 2px; }
    .btn-sm {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; color: rgba(255,255,255,0.5); font-size: 11px;
      font-family: 'Space Mono', monospace; padding: 6px 14px; cursor: pointer; transition: all 0.2s;
    }
    .btn-sm:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .input-block {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px; padding: 18px 20px;
    }
    .input-label { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .input-label .flag { font-size: 24px; }
    .input-label .code { color: rgba(255,255,255,0.5); font-size: 13px; font-weight: 600; letter-spacing: 1.5px; }
    .num-input {
      width: 100%; background: transparent; border: none; outline: none;
      color: #fff; font-size: 32px; font-family: 'Space Mono', monospace;
      font-weight: 700; letter-spacing: -1px;
    }
    .swap-wrap { display: flex; justify-content: center; margin: -12px 0; position: relative; z-index: 2; }
    .btn-swap {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: 3px solid #0a0a0a; color: #fff; font-size: 18px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(102,126,234,0.4);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-swap:hover { transform: rotate(180deg) scale(1.1); }
    .error-msg { color: #ff6b6b; font-size: 13px; margin-bottom: 16px; padding: 10px 14px; background: rgba(255,100,100,0.08); border-radius: 10px; }
    .sync { text-align: center; color: rgba(255,255,255,0.2); font-size: 10px; font-family: 'Space Mono', monospace; margin-top: 16px; }

```
/* Translate */
.translate-grid { display: flex; gap: 12px; }
.translate-col { flex: 1; display: flex; flex-direction: column; }
.translate-col label { display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.5); font-size: 13px; font-weight: 600; letter-spacing: 1.5px; margin-bottom: 8px; }
.translate-col label .flag { font-size: 20px; }
textarea {
  flex: 1; min-height: 120px; background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06); border-radius: 12px;
  padding: 14px 16px; color: #fff; font-family: 'DM Sans', sans-serif;
  font-size: 15px; line-height: 1.5; resize: vertical; outline: none; transition: border-color 0.2s;
}
textarea:focus { border-color: rgba(102,126,234,0.4); }
textarea::placeholder { color: rgba(255,255,255,0.15); }
textarea.output { color: rgba(255,255,255,0.7); }
.translate-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
.btn-primary {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border: none; border-radius: 12px; color: #fff; font-size: 14px;
  font-weight: 600; padding: 10px 24px; cursor: pointer;
  transition: opacity 0.2s, transform 0.15s; font-family: 'DM Sans', sans-serif;
}
.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-primary:disabled { opacity: 0.4; cursor: default; transform: none; }
.char-count { color: rgba(255,255,255,0.2); font-size: 10px; font-family: 'Space Mono', monospace; }

/* Metric converter */
.metric-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.metric-tab {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px; color: rgba(255,255,255,0.4); font-size: 12px;
  font-family: 'Space Mono', monospace; padding: 7px 14px; cursor: pointer;
  transition: all 0.2s; white-space: nowrap;
}
.metric-tab:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); }
.metric-tab.active {
  background: linear-gradient(135deg, rgba(102,126,234,0.2), rgba(118,75,162,0.2));
  border-color: rgba(102,126,234,0.4); color: #fff;
}
.metric-row { display: flex; gap: 12px; align-items: stretch; }
.metric-col { flex: 1; }
.metric-col .unit-label {
  color: rgba(255,255,255,0.5); font-size: 12px; font-weight: 600;
  letter-spacing: 1.5px; margin-bottom: 8px; font-family: 'Space Mono', monospace;
}
.metric-col input {
  width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px; padding: 14px 16px; color: #fff; font-size: 24px;
  font-family: 'Space Mono', monospace; font-weight: 700; outline: none;
  transition: border-color 0.2s; letter-spacing: -0.5px;
}
.metric-col input:focus { border-color: rgba(102,126,234,0.4); }
.metric-col input::placeholder { color: rgba(255,255,255,0.1); }
.metric-arrow {
  display: flex; align-items: center; justify-content: center;
  color: rgba(102,126,234,0.6); font-size: 20px; padding-top: 24px;
}
.formula-hint {
  text-align: center; color: rgba(255,255,255,0.15); font-size: 10px;
  font-family: 'Space Mono', monospace; margin-top: 14px;
}

@media (max-width: 480px) {
  .translate-grid { flex-direction: column; }
  .num-input { font-size: 28px; }
  .metric-col input { font-size: 20px; }
}

  <div class="card">

        <h2>Metric</h2>
        <div class="sub" id="metric-sub">km/h → mph</div>

<div class="metric-tabs" id="metric-tabs">
  <button class="metric-tab active" data-mode="speed" onclick="setMetric('speed')">km/h ↔ mph</button>
  <button class="metric-tab" data-mode="temp" onclick="setMetric('temp')">°C ↔ °F</button>
  <button class="metric-tab" data-mode="km-mi" onclick="setMetric('km-mi')">km ↔ mi</button>
  <button class="metric-tab" data-mode="kg-lb" onclick="setMetric('kg-lb')">kg ↔ lb</button>
  <button class="metric-tab" data-mode="cm-in" onclick="setMetric('cm-in')">cm ↔ in</button>
  <button class="metric-tab" data-mode="l-gal" onclick="setMetric('l-gal')">L ↔ gal</button>
</div>

<div class="metric-row">
  <div class="metric-col">
    <div class="unit-label" id="m-left-label">KM/H</div>
    <input type="number" inputmode="decimal" id="m-left" placeholder="0" oninput="metricLeft()">
  </div>

  <div class="metric-col">
    <div class="unit-label" id="m-right-label">MPH</div>

  </div>

  <!-- ========== TRANSLATE ========== -->

  <div class="card">
    <div class="header">
      <div>
        <h2>Translate</h2>
        <div class="sub">English → Spanish</div>
      </div>
    </div>
    <div class="translate-grid">
      <div class="translate-col">
        <label><span class="flag">🇺🇸</span> EN</label>
        <textarea id="source-text" placeholder="Type English text..." oninput="updateCharCount()"></textarea>
      </div>
      <div class="translate-col">
        <label><span class="flag">🇲🇽</span> ES</label>
        <textarea id="translated-text" class="output" placeholder="Translation appears here..." readonly></textarea>
      </div>
    </div>
    <div class="translate-footer">
      <span class="char-count" id="char-count">0 chars</span>
      <button class="btn-primary" id="btn-translate" onclick="translateText()">Translate</button>
    </div>
  </div>

<script>
// ===== CURRENCY =====
let rate = null;
let curDir = "usd-to-mxn";

async function fetchRate() {
  document.getElementById("rate-display").textContent = "fetching...";
  document.getElementById("btn-refresh").textContent = "↻";
  document.getElementById("error-box").style.display = "none";

  const attempts = [
    async () => { const r = await fetch("https://open.er-api.com/v6/latest/USD"); const d = await r.json(); return d?.rates?.MXN; },
    async () => { const r = await fetch("https://latest.currency-api.pages.dev/v1/currencies/usd.json"); const d = await r.json(); return d?.usd?.mxn; },
  ];
  let mxnRate = null;
  for (const a of attempts) { try { const v = await a(); if (v) { mxnRate = v; break; } } catch {} }

  if (mxnRate) {
    rate = mxnRate;
    document.getElementById("rate-display").textContent = "1 USD = " + rate.toFixed(4) + " MXN";
    document.getElementById("sync-time").textContent = "last sync " + new Date().toLocaleTimeString();
    document.getElementById("error-box").style.display = "none";
    onTopInput();
  } else {
    document.getElementById("rate-display").textContent = "—";
    document.getElementById("error-box").textContent = "Couldn't fetch live rates. Check connection.";
    document.getElementById("error-box").style.display = "block";
  }
  document.getElementById("btn-refresh").textContent = "Refresh";
}

function onTopInput() {
  if (!rate) return;
  const v = parseFloat(document.getElementById("top-input").value);
  document.getElementById("bottom-input").value = isNaN(v) ? "" :
    (curDir === "usd-to-mxn" ? (v * rate).toFixed(2) : (v / rate).toFixed(2));
}
function onBottomInput() {
  if (!rate) return;
  const v = parseFloat(document.getElementById("bottom-input").value);
  document.getElementById("top-input").value = isNaN(v) ? "" :
    (curDir === "usd-to-mxn" ? (v / rate).toFixed(2) : (v * rate).toFixed(2));
}
function swapCurrency() {
  const tv = document.getElementById("top-input").value;
  const bv = document.getElementById("bottom-input").value;
  if (curDir === "usd-to-mxn") {
    curDir = "mxn-to-usd";
    document.getElementById("top-flag").textContent = "🇲🇽";
    document.getElementById("top-code").textContent = "MXN";
    document.getElementById("bottom-flag").textContent = "🇺🇸";
    document.getElementById("bottom-code").textContent = "USD";
  } else {
    curDir = "usd-to-mxn";
    document.getElementById("top-flag").textContent = "🇺🇸";
    document.getElementById("top-code").textContent = "USD";
    document.getElementById("bottom-flag").textContent = "🇲🇽";
    document.getElementById("bottom-code").textContent = "MXN";
  }
  document.getElementById("top-input").value = bv;
  document.getElementById("bottom-input").value = tv;
}

// ===== METRIC =====
const modes = {
  speed:  { left: "KM/H", right: "MPH",  toR: v => v * 0.621371, toL: v => v / 0.621371, hint: "× 0.621371", sub: "km/h → mph" },
  temp:   { left: "°C",   right: "°F",   toR: v => v * 9/5 + 32, toL: v => (v - 32) * 5/9, hint: "(°C × 9/5) + 32", sub: "°C → °F" },
  "km-mi":{ left: "KM",   right: "MI",   toR: v => v * 0.621371, toL: v => v / 0.621371, hint: "× 0.621371", sub: "km → mi" },
  "kg-lb":{ left: "KG",   right: "LB",   toR: v => v * 2.20462,  toL: v => v / 2.20462,  hint: "× 2.20462", sub: "kg → lb" },
  "cm-in":{ left: "CM",   right: "IN",   toR: v => v / 2.54,     toL: v => v * 2.54,     hint: "÷ 2.54", sub: "cm → in" },
  "l-gal":{ left: "L",    right: "GAL",  toR: v => v * 0.264172, toL: v => v / 0.264172, hint: "× 0.264172", sub: "L → gal" },
};
let curMode = "speed";

function setMetric(mode) {
  curMode = mode;
  const m = modes[mode];
  document.getElementById("m-left-label").textContent = m.left;
  document.getElementById("m-right-label").textContent = m.right;
  document.getElementById("formula-hint").textContent = m.hint;
  document.getElementById("metric-sub").textContent = m.sub;
  document.getElementById("m-left").value = "";
  document.getElementById("m-right").value = "";
  document.querySelectorAll(".metric-tab").forEach(t => t.classList.toggle("active", t.dataset.mode === mode));
}

function metricLeft() {
  const v = parseFloat(document.getElementById("m-left").value);
  const m = modes[curMode];
  document.getElementById("m-right").value = isNaN(v) ? "" : smartRound(m.toR(v));
}
function metricRight() {
  const v = parseFloat(document.getElementById("m-right").value);
  const m = modes[curMode];
  document.getElementById("m-left").value = isNaN(v) ? "" : smartRound(m.toL(v));
}
function smartRound(n) {
  return Math.abs(n) >= 100 ? n.toFixed(1) : Math.abs(n) >= 1 ? n.toFixed(2) : n.toFixed(4);
}

// ===== TRANSLATE =====
function updateCharCount() {
  document.getElementById("char-count").textContent = document.getElementById("source-text").value.length + " chars";
}
async function translateText() {
  const text = document.getElementById("source-text").value.trim();
  if (!text) return;
  const btn = document.getElementById("btn-translate");
  const out = document.getElementById("translated-text");
  btn.disabled = true; btn.textContent = "Translating..."; out.value = "";
  try {
    const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=en|es";
    const res = await fetch(url);
    const data = await res.json();
    out.value = data?.responseData?.translatedText || "Translation failed.";
  } catch { out.value = "Error — check connection."; }
  btn.disabled = false; btn.textContent = "Translate";
}
document.getElementById("source-text").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) translateText();
});

fetchRate();
</script>

</body>
